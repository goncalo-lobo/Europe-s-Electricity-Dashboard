<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Europe's Electricity Mix</title>
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>
    <main class="dashboard">
      <section class="dashboard-layout" aria-label="Dashboard layout">
        <header class="topbar">
          <div class="brand">
            <h1>Europe's Energy Mix</h1>
          </div>

          <div class="global-filters" aria-label="Global dashboard filters">
            <label>
              Generation source
              <select id="source-filter">
                <option>Loading…</option>
              </select>
            </label>
            <label>
              Generation metric
              <select id="metric-filter">
                <option value="share_pct">Share of generation (%)</option>
                <option value="generation_twh">Generation (TWh)</option>
                <option value="emissions_intensity_gco2e_kwh">Emissions intensity (gCO₂e/kWh)</option>
              </select>
            </label>
            <div class="country-filter-field">
              <div class="country-filter-row">
                <label for="country-filter">Country</label>
                <div class="country-picker-controls">
                  <select id="country-filter">
                    <option value="">Choose a country</option>
                  </select>
                  <div id="selected-country-chips" class="selected-country-chips" aria-live="polite"></div>
                  <button id="country-all-trigger" class="country-picker-trigger is-all-countries" type="button" aria-label="All countries; choose a country">All countries</button>
                  <button id="country-picker-trigger" class="country-picker-trigger" type="button" aria-label="Add a country">+</button>
                </div>
              </div>
            </div>
          </div>

          <section class="year-control" aria-label="Year slider">
            <div class="year-heading">
              <div>
                <p class="eyebrow">YEAR</p>
                <strong id="year-value">2025</strong>
              </div>
            </div>
            <div class="year-slider-scale">
              <input
                id="year-slider"
                type="range"
                min="2005"
                max="2025"
                value="2025"
                step="1"
                aria-label="Selected year"
              >
              <div id="year-slider-ticks" class="year-slider-ticks" aria-hidden="true"></div>
            </div>
          </section>
        </header>

        <section class="dashboard-grid" aria-label="Dashboard idiom layout">
          <div class="left-stack">
            <article class="card idiom-panel scatter-panel">
              <div
                id="scatter-view"
                class="idiom-view"
                aria-label="Connected scatterplot of net imports and renewable balance"
              ></div>
            </article>

            <article class="card idiom-panel calendar-panel">
              <div class="card-heading calendar-heading">
                <div class="calendar-heading-info">
                  <p id="calendar-subtitle" aria-live="polite">Loading data…</p>
                  <div id="calendar-country-tag" class="idiom-country-tags" aria-label="Selected country"></div>
                  <button id="calendar-country-switch" class="calendar-country-switch" type="button" hidden></button>
                </div>
              </div>
              <div
                id="calendar-view"
                class="idiom-view"
                aria-label="Monthly generation heatmap"
              ></div>
              <div id="calendar-tooltip" class="chart-tooltip" role="tooltip" aria-hidden="true"></div>
            </article>
          </div>

          <article class="card idiom-panel spark-panel">
            <div class="card-heading spark-heading">
              <button id="spark-history-toggle" class="spark-history-toggle" type="button" aria-pressed="false">Show pre‑2016</button>
            </div>
            <div id="spark-view" class="spark-list" aria-label="Price and source sparklines"></div>
            <div id="spark-tooltip" class="chart-tooltip" role="tooltip" aria-hidden="true"></div>
          </article>
        </section>

        <div class="right-stack">
          <div class="map-year-row">
            <article class="card idiom-panel map-card">
              <p id="map-subtitle" class="map-subtitle" aria-live="polite">
                Loading map…
              </p>
              <div class="map-mode-toggle" role="group" aria-label="Map data">
                <button id="generation-map-mode" class="active" type="button" aria-pressed="true">Generation</button>
                <button id="price-map-mode" type="button" aria-pressed="false">Price</button>
              </div>
              <div class="map-zoom-controls" role="group" aria-label="Map zoom controls">
                <button type="button" data-map-zoom="in" aria-label="Zoom in">+</button>
                <button type="button" data-map-zoom="out" aria-label="Zoom out">−</button>
                <button type="button" data-map-zoom="reset">Reset</button>
              </div>
              <div id="map-legend" class="map-legend" aria-label="Map color scale"></div>
              <div
                id="map-view"
                class="idiom-view map-view"
                aria-label="Europe choropleth map"
              ></div>
              <div id="map-tooltip" class="chart-tooltip" role="tooltip" aria-hidden="true"></div>
            </article>
          </div>

          <article class="card idiom-panel tree-card">
            <div class="card-heading">
              <div>
                <p id="treemap-subtitle" aria-live="polite">Loading data…</p>
              </div>
              <div id="treemap-country-tag" class="idiom-country-tags" aria-label="Selected countries"></div>
            </div>
            <div
              id="treemap-view"
              class="idiom-view"
              aria-label="Treemap boundary"
            ></div>
            <div id="treemap-tooltip" class="chart-tooltip" role="tooltip" aria-hidden="true"></div>
          </article>
        </div>
      </section>

    </main>

    <script src="vendor/d3.min.js"></script>
    <script src="vendor/topojson-client.min.js"></script>
    <script src="idioms/choroplethmap.js"></script>
    <script src="idioms/treemap.js"></script>
    <script src="idioms/sparkline.js"></script>
    <script src="idioms/connectedscatterplot.js"></script>
    <script src="idioms/calendarheatmap.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
